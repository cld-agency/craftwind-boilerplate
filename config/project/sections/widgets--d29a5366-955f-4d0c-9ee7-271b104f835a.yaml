defaultPlacement: end
enableVersioning: true
entryTypes:
  - 3d55de4b-9675-4aa5-9975-690cc711a5ca # Cookie details table
handle: widgets
maxAuthors: 1
name: Widgets
previewTargets:
  -
    __assoc__:
      -
        - label
        - 'Standalone widget preview'
      -
        - urlFormat
        - '{url}'
      -
        - refresh
        - '1'
  -
    __assoc__:
      -
        - label
        - 'In-context preview (if available)'
      -
        - urlFormat
        - '{url}?tryRealEntry=1'
      -
        - refresh
        - '1'
propagationMethod: all
siteSettings:
  27fd5441-8230-4f21-8d4c-ae215e7076df: # $SYSTEM_NAME
    enabledByDefault: true
    hasUrls: true
    template: widget-preview.twig
    uriFormat: 'widget-preview/{slug}'
type: channel
